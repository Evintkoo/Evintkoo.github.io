name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Lets build-time canvas/data.json prefetch (src/lib/canvas-data.ts's
          # buildCanvasPrefetch) read canvas/data.json from a PRIVATE repo via
          # the authenticated GitHub API — a repo secret, not a checked-in
          # value; a fine-grained PAT with read-only Contents access to just
          # the private repos this site references is enough (broader `repo`
          # scope also works, just wider than this needs). Unset locally, so
          # `npm run build`/`astro dev` without it just falls back to every
          # repo's existing public, unauthenticated fetch path, unaffected.
          CANVAS_DATA_TOKEN: ${{ secrets.CANVAS_DATA_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
